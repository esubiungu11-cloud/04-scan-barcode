<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" href="Icon.png.jpg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff88">
<title>SCORPION SCAN - FINAL VALID</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{background:#070b12;color:#eaf3fb;max-width:480px;margin:auto;padding-bottom:120px}
.top{position:sticky;top:0;z-index:10;background:rgba(7,11,18,0.95);backdrop-filter:blur(10px);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e2d44}
.logo{font-weight:900;letter-spacing:1px}.logo span{color:#00ff88}
.badge{background:#00ff88;color:#000;font-size:10px;font-weight:800;padding:6px 10px;border-radius:20px}
.glass{background:#121a26;border:1px solid #1e2d44;border-radius:18px;padding:14px;margin:10px 12px}
#reader{width:100%;border-radius:16px;overflow:hidden;background:#000;min-height:320px}
#reader video{width:100%!important}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.btn{border:0;border-radius:12px;padding:13px 8px;font-weight:800;font-size:12px;cursor:pointer}
.btn-dark{background:#1a2332;color:#eaf3fb;border:1px solid #2a3a52}
.btn-green{background:#00ff88;color:#000}
.tabs{display:flex;gap:6px;margin:10px 12px;background:#0f1722;padding:6px;border-radius:14px;border:1px solid #1e2d44}
.tab{flex:1;padding:11px;border-radius:10px;text-align:center;font-size:12px;font-weight:800;color:#8a9bb5;cursor:pointer}
.tab.active{background:#fff;color:#000}
.input{width:100%;background:#0f1722;border:1px solid #1e2d44;border-radius:12px;padding:13px;color:#fff;margin-top:8px;font-size:14px}
.preview-box{background:#fff;border-radius:16px;padding:18px;margin-top:12px;min-height:240px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative}
#qrcode img,#qrcode canvas{max-width:220px;width:220px;height:220px;display:block}
.history-item{background:#0f1722;border:1px solid #1e2d44;border-radius:12px;padding:10px;margin-top:8px;display:flex;justify-content:space-between;align-items:center}
.result-box{background:#0f1722;border:2px solid #00ff88;border-radius:14px;padding:12px;margin-top:10px}
</style>
</head>
<body>
<div class="top"><div class="logo">🦂 SCORPION <span>SCAN</span></div><div class="badge">9 FITUR • FINAL VALID</div></div>
<div class="tabs"><div class="tab active" onclick="switchTab('scan')" id="tab-scan">SCAN</div><div class="tab" onclick="switchTab('gen')" id="tab-gen">BUAT</div><div class="tab" onclick="switchTab('hist')" id="tab-hist">HISTORY</div></div>
<div id="view-scan"><div class="glass"><div id="reader"></div><div class="controls"><button class="btn btn-dark" onclick="toggleFlash()">🔦 FLASH</button><button class="btn btn-green" onclick="startScan()">▶️ START</button><button class="btn btn-dark" onclick="stopScan()">⏹️ STOP</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><label class="btn btn-dark" style="text-align:center">🖼️ GALERI<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="scanFile()"></label><button class="btn btn-yellow" onclick="startScan()">⚡ SCAN</button></div><div id="resultArea"></div></div></div>

<div id="view-gen" style="display:none"><div class="glass">
<select id="genType" class="input" onchange="updateGenPlaceholder();autoGen()">
<option value="text" selected>Teks Biasa</option>
<option value="url">Link IG / Website</option>
<option value="wifi">WiFi</option>
<option value="wa">Nomor WA</option>
<option value="barcode">Barcode (Huruf+Angka)</option>
</select>
<input id="genInput" class="input" placeholder="Ketik teks di sini..." value="" oninput="autoGen()">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><button class="btn btn-green" onclick="doGenerateQR()">BUAT QR</button><button class="btn btn-dark" onclick="doGenerateBar()">BUAT BARCODE</button></div>
<div class="preview-box">
<div id="qrcode" style="display:none"></div>
<canvas id="barCanvas" style="display:none;background:#fff;max-width:100%;width:100%"></canvas>
<div id="emptyHint" style="color:#888;font-size:12px;text-align:center">QR akan muncul di sini KING<br>Ketik dulu di atas</div>
</div>
<button class="btn btn-green" style="width:100%;margin-top:10px;background:#00ff88;color:#000;font-size:14px;padding:15px" onclick="downloadGen()">⬇️ DOWNLOAD PNG</button>
<div id="downloadInfo" style="font-size:11px;color:#00ff88;text-align:center;margin-top:8px;font-weight:700"></div>
</div></div>

<div id="view-hist" style="display:none"><div class="glass"><div style="display:flex;justify-content:space-between"><div style="font-size:10px;color:#5a6d8a;font-weight:700">HISTORY • FAVORITE</div><button class="btn btn-dark" style="padding:6px 10px;font-size:10px" onclick="clearHist()">HAPUS</button></div><div id="histList"></div></div></div>

<div id="ad-banner-bottom" style="position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#000;border-top:2px solid #00ff88;padding:6px 0 8px;text-align:center;min-height:70px;max-width:480px;margin:0 auto;left:50%;transform:translateX(-50%);width:100%">
<div style="font-size:8px;color:#5a6d8a;margin-bottom:3px">IKLAN • SCORPION SCAN GRATIS</div>
<div><script data-cfasync="false" src="https://bauval.org/14/a74f63cdcf6298e0c7c1e8190cb639f5"></script></div>
<button onclick="document.getElementById('ad-banner-bottom').style.display='none'" style="position:absolute;top:4px;right:8px;background:#1a2332;color:#8a9bb5;border:1px solid #2a3a52;border-radius:6px;padding:3px 7px;font-size:11px">✕</button>
</div>

<script>
let html5Qr=null,isFlash=false,db=JSON.parse(localStorage.getItem('scorpion_hist')||'[]'),lastType='qr',isScanning=false;
function switchTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  document.getElementById('view-scan').style.display=t==='scan'?'block':'none';
  document.getElementById('view-gen').style.display=t==='gen'?'block':'none';
  document.getElementById('view-hist').style.display=t==='hist'?'block':'none';
  if(t==='hist')renderHist();
  if(t!=='scan')stopScan();
  else if(!isScanning)startScan();
}
async function startScan(){
  if(isScanning)return;
  document.getElementById('reader').innerHTML='';
  isScanning=true;
  html5Qr=new Html5Qrcode("reader");
  try{await html5Qr.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:250}},onScanSuccess,()=>{});}catch(e){isScanning=false;document.getElementById('reader').innerHTML='<div style="padding:20px;text-align:center;color:#ffb800">Kamera error: '+e+'</div>';}
}
async function stopScan(){isScanning=false;if(html5Qr){try{await html5Qr.stop();}catch{}try{html5Qr.clear();}catch{}html5Qr=null;}}
function toggleFlash(){if(!html5Qr||!isScanning)return alert('Start dulu');isFlash=!isFlash;html5Qr.applyVideoConstraints({advanced:[{torch:isFlash}]}).catch(()=>alert('Flash gak support'));}
function scanFile(){const f=document.getElementById('fileInput').files[0];if(!f)return;const tmp=new Html5Qrcode("reader");tmp.scanFile(f,true).then(onScanSuccess).catch(()=>alert('Gak kebaca'));}
function onScanSuccess(txt,res){if(navigator.vibrate)navigator.vibrate(200);saveHist(txt,res?.result?.format?.formatName||'QR');showResult(txt,res?.result?.format?.formatName||'QR');}
function saveHist(text,type){db.unshift({id:Date.now(),text,type,time:new Date().toLocaleString('id-ID'),fav:false});if(db.length>100)db.pop();localStorage.setItem('scorpion_hist',JSON.stringify(db));}
function showResult(text,type){
  document.getElementById('resultArea').innerHTML=`<div style="background:#0f1722;border:2px solid #00ff88;border-radius:14px;padding:12px;margin-top:10px"><b>${type}</b><div style="margin-top:8px;word-break:break-all;background:#070b12;padding:8px;border-radius:8px">${text}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn btn-green" onclick="window.open('${text}','_blank')">BUKA</button><button class="btn btn-dark" onclick="navigator.clipboard.writeText('${text}')">COPY</button></div></div>`;
}
function renderHist(){const c=document.getElementById('histList');if(!db.length){c.innerHTML='<div style="text-align:center;color:#5a6d8a;padding:20px">Belum ada</div>';return;}c.innerHTML=db.map(it=>`<div class="history-item"><div style="flex:1;overflow:hidden"><div style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${it.text.slice(0,35)}</div><div style="font-size:10px;color:#8a9bb5">${it.type}</div></div><div onclick="delHist(${it.id})">🗑️</div></div>`).join('');}
function delHist(id){db=db.filter(x=>x.id!==id);localStorage.setItem('scorpion_hist',JSON.stringify(db));renderHist();}
function clearHist(){if(confirm('Hapus semua?')){db=[];localStorage.setItem('scorpion_hist','[]');renderHist();}}
function updateGenPlaceholder(){const t=document.getElementById('genType').value;const ph={text:'Ketik teks...',url:'https://...',wifi:'Nama WiFi',wa:'628xxx...',barcode:'Teks / Angka bebas'};document.getElementById('genInput').placeholder=ph[t]||'Ketik...';}
function autoGen(){
  const v=document.getElementById('genInput').value.trim();
  const hint=document.getElementById('emptyHint');
  if(!v){
    document.getElementById('qrcode').style.display='none';document.getElementById('qrcode').innerHTML='';
    document.getElementById('barCanvas').style.display='none';
    if(hint)hint.style.display='block';
    document.getElementById('downloadInfo').textContent='';
    return;
  }
  if(hint)hint.style.display='none';
  const type=document.getElementById('genType').value;
  if(type==='barcode')doGenerateBar(); else doGenerateQR();
}
function doGenerateQR(){
  let txt=document.getElementById('genInput').value.trim();if(!txt)return;
  const t=document.getElementById('genType').value;
  if(t==='wa'){const n=txt.replace(/[^0-9]/g,'');if(n)txt='https://wa.me/'+n;}
  if(t==='wifi'&&!txt.startsWith('WIFI:'))txt='WIFI:S:'+txt+';T:WPA;P:12345678;;';
  document.getElementById('barCanvas').style.display='none';
  const qrDiv=document.getElementById('qrcode');qrDiv.style.display='block';qrDiv.innerHTML='';
  new QRCode(qrDiv,{text:txt,width:260,height:260,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.H});
  lastType='qr';
  document.getElementById('downloadInfo').textContent='✅ QR SIAP - KLIK DOWNLOAD';
}
function doGenerateBar(){
  let txt=document.getElementById('genInput').value.trim();if(!txt){txt='1234567890';}
  document.getElementById('qrcode').style.display='none';document.getElementById('qrcode').innerHTML='';
  const canvas=document.getElementById('barCanvas');
  canvas.style.display='block';
  canvas.width=600;canvas.height=200;
  const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
  try{
    JsBarcode(canvas,txt,{format:'CODE128',width:2,height:100,displayValue:true,fontSize:18,background:'#ffffff',lineColor:'#000000',margin:10});
  }catch(e){
    try{
      let num=txt.replace(/[^0-9]/g,'');if(num.length<8)num='8991234567890';if(num.length===12)num='0'+num;
      JsBarcode(canvas,num,{format:'EAN13',width:2,height:80,displayValue:true,background:'#ffffff'});
    }catch(e2){alert('Barcode error: '+e2);return;}
  }
  lastType='bar';
  document.getElementById('downloadInfo').textContent='✅ BARCODE SIAP - KLIK DOWNLOAD';
}
function downloadGen(){
  const qrDiv=document.getElementById('qrcode');
  const barCanvas=document.getElementById('barCanvas');
  if(barCanvas && barCanvas.style.display!=='none'){
    try{
      const url=barCanvas.toDataURL('image/png');
      const a=document.createElement('a');
      a.href=url;
      a.download='barcode-'+Date.now()+'.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      document.getElementById('downloadInfo').textContent='✅ BARCODE TER-DOWNLOAD!';
      return;
    }catch(e){alert('Gagal download barcode: '+e);return;}
  }
  if(qrDiv && qrDiv.style.display!=='none'){
    let url='';
    const img=qrDiv.querySelector('img');
    const canvas=qrDiv.querySelector('canvas');
    if(img && img.src)url=img.src;
    else if(canvas)url=canvas.toDataURL('image/png');
    if(url){
      const a=document.createElement('a');
      a.href=url;
      a.download='qrcode-'+Date.now()+'.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      document.getElementById('downloadInfo').textContent='✅ QR TER-DOWNLOAD!';
      return;
    }
  }
  alert('Buat QR / Barcode dulu KING! Ketik teks dulu baru BUAT');
}
updateGenPlaceholder();
setTimeout(()=>{if(!isScanning)startScan();},500);
</script>
